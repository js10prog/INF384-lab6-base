title = "gitleaks config malla-inf"

[[rules]]
id          = "generic-api-key"
description = "Variable con sufijo _API_KEY contiene un valor que parece una clave real"
regex       = '''(?i)[A-Z0-9_]*API_KEY\s*=\s*([A-Za-z0-9/+]{20,})'''
secretGroup = 1

[[rules.allowlists]]
description = "Placeholders conocidos"
regexTarget = "secret"
regexes = ['''(?i)(your.?api.?key|placeholder|example|changeme|YOUR_API_KEY_HERE)''']

[[rules.allowlists]]
description = "Archivo de ejemplo - clave ya rotada"
paths = ['''ejemplo\.env''']